[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Document parsing
    "pymupdf>=1.24.0",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    # Text splitting
    "langchain-text-splitters>=0.2.0",
    "tiktoken>=0.7.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # Cache / queue
    "redis>=5.0.0",
    "celery>=5.3.0",
    # HTTP client (Ollama API)
    "httpx>=0.27.0",
    # Config
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "db*", "ingestion*", "retrieval*", "generation*", "eval*"]
